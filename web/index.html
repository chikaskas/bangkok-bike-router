<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bangkok Bike Router</title>
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<aside id="panel">
  <header>
    <h1>Bangkok Bike Router</h1>
    <p class="sub">Routes scored on rider stress and travel time.</p>
  </header>

  <div class="form">
    <div class="field">
      <span class="dot start">A</span>
      <input id="from" type="text" placeholder="Start — e.g. Khao San Road"
             autocomplete="off" spellcheck="false">
      <div class="ac" id="from-ac"></div>
    </div>
    <div class="field">
      <span class="dot end">B</span>
      <input id="to" type="text" placeholder="Destination — e.g. Asok"
             autocomplete="off" spellcheck="false">
      <div class="ac" id="to-ac"></div>
    </div>
    <button id="go">Find bike routes</button>
  </div>

  <div class="pref">
    <div class="pref-head">
      <span class="lbl">Preference</span>
      <span id="pref-name">Calm</span>
    </div>
    <input id="pref" type="range" min="0" max="100" step="0.1" value="50"
           aria-label="Trade off speed against safety">
    <div class="pref-scale"><span>Fastest</span><span>Safest</span></div>
  </div>

  <div id="summary" class="summary"></div>

  <div id="status" class="status"></div>

  <div class="opts">
    <label><input type="checkbox" id="opt-alts"> Compare alternatives</label>
    <label><input type="checkbox" id="opt-legend"> Stress legend</label>
  </div>

  <div id="routes" class="routes" hidden></div>
</aside>

<main id="map"></main>

<div id="legend" class="legend" hidden>
  <div class="legend-title">Rider stress</div>
  <div class="legend-row"><i style="background:#16a34a"></i>1 &middot; quiet street</div>
  <div class="legend-row"><i style="background:#84cc16"></i>2 &middot; calm</div>
  <div class="legend-row"><i style="background:#f59e0b"></i>3 &middot; busy</div>
  <div class="legend-row"><i style="background:#dc2626"></i>4 &middot; hostile</div>
</div>

<script src="/vendor/leaflet/leaflet.js"></script>
<script src="/app.js"></script>
</body>
</html>
